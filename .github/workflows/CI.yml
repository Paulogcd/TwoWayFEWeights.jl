name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 200
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'
          - '1'
          - 'pre'
        R:
          - '4.6.1'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      
      - uses: actions/checkout@v7
      
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.R }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create Python test environment
        run: |
          python -m venv test/.venv
          test/.venv/bin/python -m pip install --upgrade pip
          test/.venv/bin/python -m pip install pandas
          test/.venv/bin/python -m pip install twowayfeweights
          echo "PYTHON=$GITHUB_WORKSPACE/test/.venv/bin/python" >> "$GITHUB_ENV"
      
      - name: Set LD_LIBRARY_PATH
        run: |
          echo "LD_LIBRARY_PATH=$(R RHOME)/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      
      - name: Install the original R package
        run: |
          install.packages("haven",           repos = "https://cloud.r-project.org")
          install.packages("dplyr",           repos = "https://cloud.r-project.org")
          install.packages("TwoWayFEWeights", repos = "https://cloud.r-project.org")

        shell: Rscript {0}

      # Temporary disabling caching.
      # - uses: julia-actions/cache@v3
      
      - uses: julia-actions/julia-buildpkg@v1

      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7

      - name: Diagnose Conda installation
        run: |
          echo "=== Conda package files ==="
          find ~/.julia/packages/Conda -name deps.jl -print

          echo "=== Conda root directory ==="
          if [ -d "$HOME/.julia/conda/3/x86_64" ]; then
            ls -la "$HOME/.julia/conda/3/x86_64"
          else
            echo "Conda root directory is MISSING"
          fi

          echo "=== Conda executable ==="
          if [ -x "$HOME/.julia/conda/3/x86_64/bin/conda" ]; then
            echo "Conda executable exists"
          else
            echo "Conda executable is MISSING"
          fi

          echo "=== Generated configuration ==="
          grep -R -nE 'ROOTENV|CONDA_EXE' \
            ~/.julia/packages/Conda/*/deps 2>/dev/null || true
